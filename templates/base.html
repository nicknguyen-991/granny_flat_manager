{% load static %}
<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Granny Flat Manager{% endblock %}</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('gfm-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/theme.js' %}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'crm:lead_list' %}">Granny Flat Manager</a>
      <div class="header-actions">
        <nav class="main-nav">
          <a href="{% url 'crm:lead_list' %}" class="{% if request.resolver_match.url_name == 'lead_list' %}active{% endif %}">Leads</a>
          <a href="{% url 'crm:lead_pipeline' %}" class="{% if request.resolver_match.url_name == 'lead_pipeline' %}active{% endif %}">Pipeline</a>
          <a href="{% url 'crm:client_list' %}" class="{% if 'client' in request.resolver_match.url_name %}active{% endif %}">Clients</a>
          <a href="{% url 'construction:project_list' %}" class="{% if 'project' in request.resolver_match.url_name %}active{% endif %}">Projects</a>
          <a href="{% url 'reporting:dashboard' %}" class="{% if request.resolver_match.app_name == 'reporting' %}active{% endif %}">Reports</a>
          <a href="/admin/" target="_blank" rel="noopener">Admin</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Dark mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container {% block container_class %}{% endblock %} main-content">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message message-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
